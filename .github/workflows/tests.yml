name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: iOS Simulator
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "No Xcode.app found in /Applications"
            exit 1
          fi
          echo "Using $xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcode-select -p
          xcodebuild -version

      - name: Resolve iPhone simulator
        id: sim
        run: |
          python3 <<'PY'
          import json, os, subprocess

          raw = subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"]
          )
          data = json.loads(raw)
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              runtime_l = runtime.lower()
              if "ios" not in runtime_l:
                  continue
              for device in devices:
                  name = device.get("name", "")
                  if device.get("isAvailable") and "iPhone" in name:
                      candidates.append((runtime, name, device["udid"]))
          if not candidates:
              raise SystemExit("No available iPhone simulator")
          runtime, name, udid = sorted(candidates)[-1]
          print(f"Using {name} ({runtime}) {udid}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"udid={udid}\n")
          PY

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project SatelliteWatch.xcodeproj \
            -scheme SatelliteWatch \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: TestResults.xcresult
          if-no-files-found: ignore
