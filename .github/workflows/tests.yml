name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    # Xcode 27 image (arm64). Ships Xcode 27.0 as the only — and default —
    # toolchain, so no setup-xcode pin is needed.
    # https://github.com/actions/runner-images/blob/main/images/macos/xcode-27-arm64-Readme.md
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Test
        run: |
          xcodebuild \
            -project SatelliteWatch.xcodeproj \
            -scheme SatelliteWatch \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -skipMacroValidation \
            test
