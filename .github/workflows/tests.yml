name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Project format is Xcode 16 (objectVersion 77). macos-15 defaults to
      # 16.4; pin it so a newer default cannot reject the file again.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Test
        run: |
          xcodebuild \
            -project SatelliteWatch.xcodeproj \
            -scheme SatelliteWatch \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -skipMacroValidation \
            test
